<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cream background -->
  <rect width="64" height="64" rx="13" fill="#f4e1d3"/>
  <!-- Subtle inner glow to add depth -->
  <rect width="64" height="64" rx="13" fill="url(#shine)" opacity="0.4"/>
  <defs>
    <radialGradient id="shine" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Thin champagne ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#c39a52" stroke-width="0.85" opacity="0.55"/>
  <!-- Accent dots on the ring — 10 o'clock and 4 o'clock -->
  <circle cx="10.5" cy="19.5" r="2.2" fill="#c39a52"/>
  <circle cx="53.5" cy="44.5" r="2.2" fill="#c39a52"/>
  <!-- TC monogram -->
  <text
    x="32" y="42"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="27"
    font-weight="500"
    fill="#c39a52"
    letter-spacing="-0.5">TC</text>
</svg>
